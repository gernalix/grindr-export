schema_version: c2.project-capsule.v1
identity:
  project_id: 106
  slug: grindr-export
  repository_id: R0107
scope:
  purpose: Normalize explicitly acquired Grindr Web DOM snapshots into a verifiable
    offline archive without acquiring credentials.
  boundaries:
  - Never open a Grindr tab, Pixel UI, private APIs, caches or live archive for capsule
    verification.
  - The actual UI terminal history-start marker is required for a complete Web export;
    unchanged scroll geometry alone is insufficient.
repository:
  canonical_workdir: /home/daniele/projects/grindr-export
  branch_policy: Use isolated task worktrees and the installed Git single writer;
    preserve the existing primary branch and all unintegrated work.
architecture:
  summary: grindr_snapshots.py reconciles snapshot overlap. grindr_media.py owns local
    media ingestion, magic/hash validation, manifests and safe associations. grindr_dom_archive.py
    orchestrates extraction and staged SQLite/JSON/CSV/viewer publication. Browser/Pixel
    acquisition is a separate, explicitly authorized phase.
  entrypoints:
  - grindr_dom_archive.py
  - grindr_media.py
  important_paths:
  - grindr_snapshots.py
  - tests
  - README.md
  - GRINDR_EXPORT_MINIPROMPT.md
  - PIXEL_CHAT_VERIFICATION.md
dependencies:
- name: Python standard library
  purpose: Offline application code, SQLite where applicable and unit fixtures.
- name: Bubblewrap
  purpose: FULL verification isolates networking, processes, user home, runtime sockets,
    devices and host data; source is read-only.
data:
  schema: Each private export preserves raw DOM acquisition and produces messages,
    media and non_exportable tables plus metadata, JSON/CSV/viewer and a last-write
    hash receipt. Web oldest-boundary evidence does not prove absolute Android history
    completeness.
  migrations: Preserve immutable acquisition/media bytes and existing exports. Use
    staged output publication and the owning normalizer; never byte-merge or overwrite
    a live archive database to resolve Git state.
runtime:
  services: []
  timers: []
  containers: []
devices:
- Pixel and browser acquisition are specialist operations; offline tests use synthetic
  DOM/media fixtures only.
commands:
  setup:
    not_applicable: Python standard library for offline normalization/tests. Browser/device
      acquisition is separate.
  build:
    not_applicable: Python source has no required compiled build.
