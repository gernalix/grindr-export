  deploy_install:
    not_applicable: On-demand source utility; no runtime service installation. Acquisition
      and real export generation are separate.
  smoke:
    not_applicable: Live runtime/data/desktop/device checks are separate operations,
      never capsule hooks.
  verify:
    fast:
      argv:
      - python3
      - /home/daniele/projects/codex-roadmap/tools/project_capsule.py
      - --repo
      - .
      - --mode
      - FAST
      cwd: .
    full:
      argv:
      - python3
      - /home/daniele/projects/codex-roadmap/tools/project_capsule.py
      - --repo
      - .
      - --mode
      - FULL
      cwd: .
safety:
  invariants:
  - No cookies, tokens, signed media query strings, private chat bodies or real archive
    data in Git/output.
  - Preserve raw acquisition and non-exportable records; do not bypass protected/expired
    assets.
  - Keep Web and Android history gates separate and verify exact media hashes/associations.
  risky_operations:
  - Acquisition, real-media ingest and archive generation change private exports or
    interact with browsers/devices.
  recovery:
  - Preserve original runtime data and sources; use consistent private backups and
    owning semantic writers for recovery.
  - Source integration does not install, restart or validate live consumers.
acceptance:
- FAST validates identity, schema, local paths, executable commands and reviewed-source
  freshness.
- FULL passes the existing fixture suite inside the isolated read-only-source sandbox.
- No live browser, clipboard, disk, credential, notification or private archive operation
  is implied.
references:
  megavault: /home/daniele/MegaVault/megavault.sqlite
  c2: Historical-only /home/daniele/projects/codex-roadmap/roadmap.sqlite; no lifecycle
    writes or dispatcher use.
freshness:
  reviewed_commit: 13bf434f7933f969dea5cdd606219a469daba330
  watch_paths:
  - grindr_dom_archive.py
  - grindr_media.py
  - grindr_snapshots.py
  - tests
  - NV.txt
artifacts:
  agents: AGENTS.md
  architecture: README.md
  operations: README.md
  data_model: grindr_dom_archive.py
validation_hooks:
- id: isolated-offline-tests
  argv: *id001
  cwd: .
  safe: true
change_verification:
- paths:
  - project-capsule.yaml
  - AGENTS.md
  - '*.md'
  commands:
  - lint
- paths:
  - '*.py'
  - src/*
  - tests/*
  - scripts/*
  - systemd/*
  - packaging/*
  commands:
  - test_full
